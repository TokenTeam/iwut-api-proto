syntax = "proto3";
package auth_center.v1.identity;
option go_package = "iwut-auth-center/api/gen/go/auth_center/v1/identity;identity";
// Internal service only: requires registered service JWS, auth.identity.issue,
// caller audience allowlist, and exactly one x-iwut-session metadata value.
service UserIdentityService {
 rpc IssueUserIdentityFromSession(IssueUserIdentityFromSessionRequest) returns (IssuedUserIdentity);
}
message IssueUserIdentityFromSessionRequest { string audience = 1; }
message IssuedUserIdentity { string identity_jws = 1; int64 expires_at_unix_seconds = 2; }
