syntax = "proto3";
package auth_center.v1.credential_management;
option go_package = "github.com/TokenTeam/iwut-api-proto/gen/go/auth_center/v1/credential_management;credential_management";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "auth_center/v1/authentication/authentication.proto";
service CredentialManagementService {
  rpc ListOwnCredentials(ListOwnCredentialsRequest) returns (OwnCredentialPage) {
    option (google.api.http) = {post: "/v1/users/me/credentials:list" body: "*"};
  }
  rpc SetOwnCredentialLabel(SetOwnCredentialLabelRequest) returns (OwnCredentialLabel) {
    option (google.api.http) = {post: "/v1/users/me/credentials:set-label" body: "*"};
  }
  rpc BeginOtherCredentialRevocation(BeginOtherCredentialRevocationRequest) returns (CredentialRevocationStarted) {
    option (google.api.http) = {post: "/v1/users/me/credentials/revocation:begin" body: "*"};
  }
  rpc CompleteOtherCredentialRevocation(CompleteOtherCredentialRevocationRequest) returns (auth_center.v1.authentication.CredentialRevoked) {
    option (google.api.http) = {post: "/v1/users/me/credentials/revocation:complete" body: "*"};
  }
}
message ListOwnCredentialsRequest {
  optional uint32 page_size = 1;
  string cursor = 2;
}
message OwnCredentialPage {
  string current_credential_id = 1;
  google.protobuf.Timestamp observed_at = 2;
  repeated OwnCredentialSummary credentials = 3;
  string next_cursor = 4;
}
message OwnCredentialSummary {
  string credential_id = 1;
  string label = 2;
  int64 label_revision = 3;
  google.protobuf.Timestamp created_at = 4;
  bool is_current = 5;
}
message SetOwnCredentialLabelRequest {
  string credential_id = 1;
  optional string label = 2;
  optional int64 expected_label_revision = 3;
}
message OwnCredentialLabel {
  string credential_id = 1;
  string label = 2;
  int64 label_revision = 3;
}
message BeginOtherCredentialRevocationRequest {
  string request_id = 1;
  string target_credential_id = 2;
}
message CredentialRevocationStarted {
  string operation_id = 1;
  string current_session_id = 2;
  string current_credential_id = 3;
  string target_credential_id = 4;
  bytes challenge = 5;
  google.protobuf.Timestamp expires_at = 6;
  bytes signing_payload = 7;
}
message CompleteOtherCredentialRevocationRequest {
  string operation_id = 1;
  bytes signature_der = 2;
  string current_password = 3;
}
