syntax = "proto3";
package auth_center.v1.password_management;

import "google/api/annotations.proto";
import "auth_center/v1/authentication/authentication.proto";

option go_package = "github.com/TokenTeam/iwut-api-proto/gen/go/auth_center/v1/password_management;passwordmanagementv1";

// Exact DIRECT methods. Change/Get require the sole x-iwut-session carrier;
// Reset methods require the Session key to be absent. All secrets use TLS body,
// never query/path/log fields. Public registration waits for the complete gates.
service PasswordManagementService {
  rpc ChangeOwnPassword(ChangeOwnPasswordRequest) returns (PasswordChanged) {
    option (google.api.http) = {post: "/v1/users/me/password:change" body: "*"};
  }
  rpc GetOwnPasswordChange(GetOwnPasswordChangeRequest) returns (OwnPasswordChange) {
    option (google.api.http) = {post: "/v1/users/me/password-changes:get" body: "*"};
  }
  rpc BeginPasswordReset(BeginPasswordResetRequest) returns (PasswordResetStarted) {
    option (google.api.http) = {post: "/v1/password-resets" body: "*"};
  }
  rpc CompletePasswordReset(CompletePasswordResetRequest) returns (PasswordResetCompleted) {
    option (google.api.http) = {post: "/v1/password-resets:complete" body: "*"};
  }
}

message ChangeOwnPasswordRequest {
  string request_id = 1;
  string current_password = 2;
  string new_password = 3;
}
message PasswordChanged {
  string operation_id = 1;
  auth_center.v1.authentication.SessionEstablished session = 2;
}
message GetOwnPasswordChangeRequest { string request_id = 1; }
enum PasswordChangeStatus {
  PASSWORD_CHANGE_STATUS_UNSPECIFIED = 0;
  NOT_FOUND = 1;
  COMPLETED = 2;
}
message OwnPasswordChange {
  PasswordChangeStatus status = 1;
  optional string operation_id = 2;
  int64 observed_at_unix_ms = 3;
}
message BeginPasswordResetRequest {
  string request_id = 1;
  string login_email = 2;
}
message PasswordResetStarted {
  string operation_id = 1;
  int64 expires_at_unix_ms = 2;
  int64 resend_after_unix_ms = 3;
}
message CompletePasswordResetRequest {
  string operation_id = 1;
  string code = 2;
  string new_password = 3;
}
message PasswordResetCompleted { string operation_id = 1; }
