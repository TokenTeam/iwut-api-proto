syntax = "proto3";

package auth_center.v1.application_close_reauth;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/TokenTeam/iwut-api-proto/gen/go/auth_center/v1/application_close_reauth;applicationclosereauth";

service ApplicationCloseReauthService {
  rpc BeginApplicationCloseReauth(BeginApplicationCloseReauthRequest) returns (BeginApplicationCloseReauthResponse) {
    option (google.api.http) = {post: "/v1/application-close-reauth:begin" body: "*"};
  }
  rpc CompleteApplicationCloseReauth(CompleteApplicationCloseReauthRequest) returns (CompleteApplicationCloseReauthResponse) {
    option (google.api.http) = {post: "/v1/application-close-reauth:complete" body: "*"};
  }
}

message BeginApplicationCloseReauthRequest { string application_id = 1; }
message BeginApplicationCloseReauthResponse {
  string operation_id = 1;
  bytes challenge = 2;
  google.protobuf.Timestamp expires_at = 3;
}
message CompleteApplicationCloseReauthRequest {
  string operation_id = 1;
  string application_id = 2;
  bytes signature_der = 3;
}
message CompleteApplicationCloseReauthResponse {
  string proof_jws = 1;
  google.protobuf.Timestamp expires_at = 2;
}
