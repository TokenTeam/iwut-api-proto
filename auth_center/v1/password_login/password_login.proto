syntax = "proto3";
package auth_center.v1.password_login;

import "google/api/annotations.proto";
import "auth_center/v1/authentication/authentication.proto";

option go_package = "github.com/TokenTeam/iwut-api-proto/gen/go/auth_center/v1/password_login;passwordloginv1";

// Exact anonymous DIRECT methods: any supplied Session carrier is rejected.
// Password and device proof are independently submitted at Complete. The
// challenge contains no password/owner/revision and never creates an account.
service PasswordLoginService {
  rpc BeginPasswordLogin(BeginPasswordLoginRequest) returns (PasswordLoginStarted) {
    option (google.api.http) = {post: "/v1/password-logins" body: "*"};
  }
  rpc CompletePasswordLogin(CompletePasswordLoginRequest) returns (PasswordLoginResult) {
    option (google.api.http) = {post: "/v1/password-logins:complete" body: "*"};
  }
}
message BeginPasswordLoginRequest {
  string request_id = 1;
  string login_email = 2;
  auth_center.v1.authentication.CredentialRegistrationProposal credential_proposal = 3;
}
message PasswordLoginStarted {
  string operation_id = 1;
  bytes challenge = 2;
  bytes signing_payload = 3;
  string protocol_version = 4;
  int64 expires_at_unix_ms = 5;
}
message CompletePasswordLoginRequest {
  string operation_id = 1;
  string password = 2;
  auth_center.v1.authentication.CredentialProof proof = 3;
}
message PasswordLoginResult {
  string auth_id = 1;
  string credential_id = 2;
  auth_center.v1.authentication.SessionEstablished session = 3;
}
