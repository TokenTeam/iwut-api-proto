syntax = "proto3";
package app_center.v1.catalog;
option go_package = "github.com/TokenTeam/iwut-api-proto/gen/go/app_center/v1/catalog;catalog";
// Missing capabilities maps to HTTP422 / gRPC FAILED_PRECONDITION. Its only
// ErrorInfo metadata entry is missingCapabilities, a JSON array of sorted names.
// Inconsistent publication maps to HTTP503 / gRPC UNAVAILABLE.
enum ErrorReason {
  ERROR_REASON_UNSPECIFIED = 0;
  ERROR_REASON_AUTHENTICATED_USER_REQUIRED = 1;
  ERROR_REASON_INVALID_AUTHENTICATED_USER = 2;
  ERROR_REASON_INVALID_APPLICATION_ID = 3;
  ERROR_REASON_INVALID_HOST_RPC_API_MAJOR = 4;
  ERROR_REASON_INVALID_HOST_CAPABILITIES = 5;
  ERROR_REASON_APPLICATION_NOT_FOUND = 6;
  ERROR_REASON_APPLICATION_TESTER_REQUIRED = 7;
  ERROR_REASON_APPLICATION_TEST_TARGET_UNAVAILABLE = 8;
  ERROR_REASON_HOST_CAPABILITIES_INSUFFICIENT = 9;
  ERROR_REASON_APPLICATION_TEST_PUBLICATION_INCONSISTENT = 10;
  ERROR_REASON_INTERNAL = 11;
  ERROR_REASON_INVALID_RESOLVE_TEST_LAUNCH_REQUEST = 12;
}
