syntax = "proto3";

package app_center.v1.oauth_client;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/TokenTeam/iwut-api-proto/gen/go/app_center/v1/oauth_client;oauthclient";

service OAuthClientService {
  rpc RegisterOAuthClient(RegisterOAuthClientRequest) returns (RegisterOAuthClientResponse) {
    option (google.api.http) = {
      post: "/v1/applications/{application_id}/oauth-registrations/{channel}/clients"
      body: "command"
    };
  }
  rpc GetApplicationOAuthRegistration(GetApplicationOAuthRegistrationRequest)
      returns (GetApplicationOAuthRegistrationResponse) {
    option (google.api.http) = {
      get: "/v1/applications/{application_id}/oauth-registrations/{channel}"
    };
  }
  rpc SetOAuthClientStatus(SetOAuthClientStatusRequest) returns (SetOAuthClientStatusResponse) {
    option (google.api.http) = {
      put: "/v1/oauth-clients/{client_id}/status"
      body: "command"
    };
  }
  rpc GetOAuthClientCredentialMetadata(GetOAuthClientCredentialMetadataRequest)
      returns (GetOAuthClientCredentialMetadataResponse) {
    option (google.api.http) = {
      get: "/v1/oauth-clients/{client_id}/credential"
    };
  }
  rpc RotateOAuthClientSecret(RotateOAuthClientSecretRequest) returns (RotateOAuthClientSecretResponse) {
    option (google.api.http) = {
      post: "/v1/oauth-clients/{client_id}/credential-rotations"
      body: "command"
    };
  }
}

enum OAuthChannel {
  OAUTH_CHANNEL_UNSPECIFIED = 0;
  OAUTH_CHANNEL_TEST = 1;
  OAUTH_CHANNEL_GREY = 2;
  OAUTH_CHANNEL_STABLE = 3;
}

enum OAuthClientType {
  OAUTH_CLIENT_TYPE_UNSPECIFIED = 0;
  OAUTH_CLIENT_TYPE_PUBLIC_PKCE = 1;
  OAUTH_CLIENT_TYPE_CONFIDENTIAL_SECRET = 2;
}

enum OAuthClientStatus {
  OAUTH_CLIENT_STATUS_UNSPECIFIED = 0;
  OAUTH_CLIENT_STATUS_ACTIVE = 1;
  OAUTH_CLIENT_STATUS_DISABLED = 2;
}

message RegisterOAuthClientRequest {
  string application_id = 1;
  OAuthChannel channel = 2;
  RegisterOAuthClientCommand command = 3;
}

message RegisterOAuthClientCommand {
  OAuthClientType type = 1;
  optional int64 expected_registration_revision = 2;
}

message RegisterOAuthClientResponse {
  ApplicationOAuthRegistrationResource registration = 1;
  // Present only after a newly committed CONFIDENTIAL_SECRET registration.
  // It is never returned by reads and must not be logged or cached.
  optional string client_secret = 2;
}

message GetApplicationOAuthRegistrationRequest {
  string application_id = 1;
  OAuthChannel channel = 2;
}

message GetApplicationOAuthRegistrationResponse {
  ApplicationOAuthRegistrationResource registration = 1;
}

message SetOAuthClientStatusRequest {
  string client_id = 1;
  SetOAuthClientStatusCommand command = 2;
}

message SetOAuthClientStatusCommand {
  int64 expected_registration_revision = 1;
  OAuthClientStatus status = 2;
}

message SetOAuthClientStatusResponse {
  bool changed = 1;
  ApplicationOAuthRegistrationResource registration = 2;
}

message GetOAuthClientCredentialMetadataRequest {
  string client_id = 1;
}

message GetOAuthClientCredentialMetadataResponse {
  OAuthClientCredentialMetadata credential = 1;
}

message RotateOAuthClientSecretRequest {
  string client_id = 1;
  RotateOAuthClientSecretCommand command = 2;
}

message RotateOAuthClientSecretCommand {
  int64 expected_credential_revision = 1;
}

message RotateOAuthClientSecretResponse {
  OAuthClientCredentialMetadata credential = 1;
  // One-time secret from a definitely committed rotation. Never log or cache.
  string client_secret = 2;
}

message OAuthClientIdentityResource {
  string client_id = 1;
  OAuthClientType type = 2;
  OAuthClientStatus status = 3;
  int64 authorization_epoch = 4;
  string created_by = 5;
  google.protobuf.Timestamp created_at = 6;
  string status_updated_by = 7;
  google.protobuf.Timestamp status_updated_at = 8;
}

message ApplicationOAuthRegistrationResource {
  string application_id = 1;
  OAuthChannel channel = 2;
  OAuthClientIdentityResource public_client = 3;
  OAuthClientIdentityResource confidential_client = 4;
  int64 registration_revision = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message OAuthClientCredentialMetadata {
  string client_id = 1;
  int64 credential_revision = 2;
  string rotated_by = 3;
  google.protobuf.Timestamp rotated_at = 4;
}
