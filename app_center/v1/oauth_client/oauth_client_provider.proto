syntax = "proto3";

package app_center.v1.oauth_client;

import "app_center/v1/oauth_client/oauth_client.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/TokenTeam/iwut-api-proto/gen/go/app_center/v1/oauth_client;oauthclient";

// OAuthClientProviderService is an Auth-only native gRPC service. It has no
// google.api.http annotations and must never be registered on the HTTP server.
service OAuthClientProviderService {
  rpc GetClientConfiguration(GetClientConfigurationRequest) returns (GetClientConfigurationResponse);
  rpc VerifyClientSecret(VerifyClientSecretRequest) returns (VerifyClientSecretResponse);
  rpc ResolveClientRuntimeConfiguration(ResolveClientRuntimeConfigurationRequest)
      returns (ResolveClientRuntimeConfigurationResponse);
  rpc ResolveAuthorizationContext(ResolveAuthorizationContextRequest)
      returns (ResolveAuthorizationContextResponse);
  rpc GetApplicationPublishedRedirects(GetApplicationPublishedRedirectsRequest)
      returns (GetApplicationPublishedRedirectsResponse);
}

enum TokenEndpointAuthMethod {
  TOKEN_ENDPOINT_AUTH_METHOD_UNSPECIFIED = 0;
  TOKEN_ENDPOINT_AUTH_METHOD_NONE = 1;
  TOKEN_ENDPOINT_AUTH_METHOD_CLIENT_SECRET_BASIC = 2;
}

message GetClientConfigurationRequest { string client_id = 1; }

message OAuthClientConfiguration {
  string client_id = 1;
  string application_id = 2;
  OAuthClientType type = 3;
  OAuthChannel channel = 4;
  OAuthClientStatus status = 5;
  int64 registration_revision = 6;
  int64 authorization_epoch = 7;
  TokenEndpointAuthMethod token_endpoint_auth_method = 8;
  optional int64 credential_revision = 9;
}

message GetClientConfigurationResponse { OAuthClientConfiguration configuration = 1; }

message VerifyClientSecretRequest {
  string client_id = 1;
  string client_secret = 2;
  int64 expected_credential_revision = 3;
}

message VerifyClientSecretResponse {
  bool verified = 1;
  int64 credential_revision = 2;
}

message ApplicationDisplay {
  string profile_revision_id = 1;
  string display_name = 2;
  google.protobuf.Value description = 3;
  google.protobuf.Value icon = 4;
}

message RuntimeVersion {
  string version_id = 1;
  int64 publication_revision = 2;
  string profile_revision_id = 3;
  string admin_auth_id = 4;
}

message RuntimeConfiguration {
  string client_id = 1;
  string application_id = 2;
  OAuthClientType type = 3;
  OAuthChannel channel = 4;
  int32 rpc_api_major = 5;
  int64 registration_revision = 6;
  int64 authorization_epoch = 7;
  string admin_auth_id = 8;
  string version_id = 9;
  int64 publication_revision = 10;
  repeated string redirect_uris = 11;
  repeated string required_scopes = 12;
  repeated string optional_scopes = 13;
  ApplicationDisplay display = 14;
  google.protobuf.Timestamp observed_at = 15;
  google.protobuf.Timestamp valid_until = 16;
}

message ResolveClientRuntimeConfigurationRequest {
  string client_id = 1;
  OAuthChannel channel = 2;
  int32 rpc_api_major = 3;
  int64 expected_registration_revision = 4;
}

message ResolveClientRuntimeConfigurationResponse { RuntimeConfiguration runtime = 1; }

message ResolveAuthorizationContextRequest {
  string client_id = 1;
  string auth_id = 2;
  OAuthChannel channel = 3;
  int32 rpc_api_major = 4;
  int64 expected_registration_revision = 5;
  RuntimeVersion expected_runtime_version = 6;
}

message AuthorizationContext {
  RuntimeConfiguration runtime = 1;
  string auth_id = 2;
  string tester_membership_id = 3;
}

message ResolveAuthorizationContextResponse { AuthorizationContext context = 1; }

message GetApplicationPublishedRedirectsRequest { string application_id = 1; }

message PublishedRedirectEntry {
  OAuthChannel channel = 1;
  int32 rpc_api_major = 2;
  string version_id = 3;
  int64 publication_revision = 4;
}

message PublishedRedirectSnapshot {
  string application_id = 1;
  repeated PublishedRedirectEntry entries = 2;
  repeated string redirect_uris = 3;
  google.protobuf.Timestamp observed_at = 4;
  google.protobuf.Timestamp valid_until = 5;
}

message GetApplicationPublishedRedirectsResponse { PublishedRedirectSnapshot snapshot = 1; }
