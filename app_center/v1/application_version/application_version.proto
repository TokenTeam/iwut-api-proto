syntax = "proto3";

package app_center.v1.application_version;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/TokenTeam/iwut-api-proto/gen/go/app_center/v1/application_version;applicationversion";

// ApplicationVersion exposes resource-oriented version commands.
service ApplicationVersion {
  rpc CreateApplicationVersion(CreateApplicationVersionRequest)
      returns (CreateApplicationVersionResponse) {
    option (google.api.http) = {
      post: "/v1/applications/{application_id}/versions"
      body: "*"
    };
  }
  rpc UpdateApplicationVersion(UpdateApplicationVersionRequest)
      returns (UpdateApplicationVersionResponse) {
    option (google.api.http) = {
      put: "/v1/applications/{application_id}/versions/{version_id}"
      body: "replacement"
    };
  }
  rpc ListApplicationVersions(ListApplicationVersionsRequest)
      returns (OwnedApplicationVersionPage) {
    option (google.api.http) = {
      post: "/v1/applications/{application_id}/versions:search"
      body: "query"
    };
  }
  rpc GetApplicationVersion(GetApplicationVersionRequest)
      returns (OwnedApplicationVersionDetail) {
    option (google.api.http) = {
      get: "/v1/applications/{application_id}/versions/{version_id}"
    };
  }
}

message CreateApplicationVersionRequest {
  // HTTP obtains application_id from the resource path. Native gRPC callers
  // carry the same value in this field.
  string application_id = 1;
  string version_label = 2;
  string launch_url = 3;
  int32 rpc_api_min_version = 4;
  int32 rpc_api_max_version_exclusive = 5;
  repeated string required_capabilities = 6;
  repeated string required_scopes = 7;
  repeated string optional_scopes = 8;
  OAuthRedirectConfiguration oauth_redirects = 9;
}

message CreateApplicationVersionResponse {
  string version_id = 1;
  string application_id = 2;
  int32 sequence = 3;
  string version_label = 4;
  string launch_url = 5;
  int32 rpc_api_min_version = 6;
  int32 rpc_api_max_version_exclusive = 7;
  repeated string required_capabilities = 8;
  repeated string required_scopes = 9;
  repeated string optional_scopes = 10;
  string review_status = 11;
  string created_by = 12;
  google.protobuf.Timestamp created_at = 13;
  int64 revision = 14;
  string updated_by = 15;
  google.protobuf.Timestamp updated_at = 16;
  OAuthRedirectConfiguration oauth_redirects = 17;
}

message UpdateApplicationVersionRequest {
  string application_id = 1;
  string version_id = 2;
  // Native gRPC callers provide expected_revision. HTTP callers use If-Match;
  // body targets replacement so JSON cannot override this protocol field.
  int64 expected_revision = 3;
  DraftApplicationVersionReplacement replacement = 4;
}

message DraftApplicationVersionReplacement {
  string version_label = 1;
  string launch_url = 2;
  int32 rpc_api_min_version = 3;
  int32 rpc_api_max_version_exclusive = 4;
  repeated string required_capabilities = 5;
  repeated string required_scopes = 6;
  repeated string optional_scopes = 7;
  OAuthRedirectConfiguration oauth_redirects = 8;
}

message UpdateApplicationVersionResponse {
  string version_id = 1;
  string application_id = 2;
  int32 sequence = 3;
  string version_label = 4;
  string launch_url = 5;
  int32 rpc_api_min_version = 6;
  int32 rpc_api_max_version_exclusive = 7;
  repeated string required_capabilities = 8;
  repeated string required_scopes = 9;
  repeated string optional_scopes = 10;
  string review_status = 11;
  string created_by = 12;
  google.protobuf.Timestamp created_at = 13;
  int64 revision = 14;
  string updated_by = 15;
  google.protobuf.Timestamp updated_at = 16;
  OAuthRedirectConfiguration oauth_redirects = 17;
}

// OAuthRedirectConfiguration is reviewed version content. Both arrays are
// required by the application contract; an empty array disables that client
// type for this version.
message OAuthRedirectConfiguration {
  repeated string pkce_redirect_uris = 1;
  repeated string confidential_redirect_uris = 2;
}

message ListApplicationVersionsRequest {
  string application_id = 1;
  ListApplicationVersionsQuery query = 2;
}

message ListApplicationVersionsQuery {
  optional string review_status = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message GetApplicationVersionRequest {
  string application_id = 1;
  string version_id = 2;
}

message OwnedApplicationVersionReviewSummary {
  string review_id = 1;
  int32 attempt = 2;
  string status = 3;
  google.protobuf.Timestamp submitted_at = 4;
  optional google.protobuf.Timestamp decided_at = 5;
  optional google.protobuf.Timestamp restored_at = 6;
}

message OwnedApplicationVersionSummary {
  string version_id = 1;
  string application_id = 2;
  int32 sequence = 3;
  string version_label = 4;
  int32 rpc_api_min_version = 5;
  int32 rpc_api_max_version_exclusive = 6;
  string review_status = 7;
  int64 revision = 8;
  string created_by = 9;
  google.protobuf.Timestamp created_at = 10;
  string updated_by = 11;
  google.protobuf.Timestamp updated_at = 12;
  optional OwnedApplicationVersionReviewSummary latest_review = 13;
}

message OwnedApplicationVersionPage {
  repeated OwnedApplicationVersionSummary items = 1;
  string next_page_token = 2;
  google.protobuf.Timestamp as_of = 3;
}

message OwnedApplicationVersionResource {
  string version_id = 1;
  string application_id = 2;
  int32 sequence = 3;
  string version_label = 4;
  string launch_url = 5;
  int32 rpc_api_min_version = 6;
  int32 rpc_api_max_version_exclusive = 7;
  repeated string required_capabilities = 8;
  repeated string required_scopes = 9;
  repeated string optional_scopes = 10;
  OAuthRedirectConfiguration oauth_redirects = 11;
  string review_status = 12;
  int64 revision = 13;
  string created_by = 14;
  google.protobuf.Timestamp created_at = 15;
  string updated_by = 16;
  google.protobuf.Timestamp updated_at = 17;
}

message OwnedApplicationVersionReviewDecision {
  string outcome = 1;
  optional string reason = 2;
  google.protobuf.Timestamp decided_at = 3;
}

message OwnedApplicationVersionDraftRestoration {
  google.protobuf.Timestamp restored_at = 1;
}

message OwnedApplicationVersionLatestReview {
  string review_id = 1;
  int32 attempt = 2;
  string status = 3;
  string submitted_by = 4;
  google.protobuf.Timestamp submitted_at = 5;
  optional OwnedApplicationVersionReviewDecision decision = 6;
  optional OwnedApplicationVersionDraftRestoration draft_restoration = 7;
}

message OwnedApplicationVersionDetail {
  OwnedApplicationVersionResource version = 1;
  optional OwnedApplicationVersionLatestReview latest_review = 2;
  google.protobuf.Timestamp as_of = 3;
}
