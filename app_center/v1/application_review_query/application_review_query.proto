syntax = "proto3";
package app_center.v1.application_review_query;
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "app_center/v1/application_review/application_review.proto";
option go_package = "github.com/TokenTeam/iwut-api-proto/gen/go/app_center/v1/application_review_query;applicationreviewquery";

service ApplicationReviewQueryService {
  rpc ListPendingApplicationVersionReviews(ListPendingApplicationVersionReviewsRequest) returns (PendingApplicationVersionReviewPage) {
    option (google.api.http) = {post: "/v1/reviews/application-versions:search" body: "query"};
  }
  rpc GetApplicationVersionReview(GetApplicationVersionReviewRequest) returns (ApplicationVersionReviewDetail) {
    option (google.api.http) = {get: "/v1/applications/{application_id}/versions/{version_id}/reviews/{review_id}"};
  }
}
message ListPendingApplicationVersionReviewsRequest { ListPendingApplicationVersionReviewsQuery query = 1; }
message ListPendingApplicationVersionReviewsQuery { optional string application_id = 1; int32 page_size = 2; string page_token = 3; }
message GetApplicationVersionReviewRequest { string application_id = 1; string version_id = 2; string review_id = 3; }
enum ReviewConflict { REVIEW_CONFLICT_UNSPECIFIED = 0; CURRENT_ADMIN = 1; VERSION_CREATOR = 2; REVIEW_SUBMITTER = 3; }
message ReviewDecisionEligibility { bool eligible = 1; repeated ReviewConflict conflicts = 2; }
message PendingApplicationVersionReview {
  string application_id = 1; string application_name = 2; string version_id = 3; string version_label = 4;
  string review_id = 5; int32 attempt = 6; string submitted_by = 7; google.protobuf.Timestamp submitted_at = 8;
  ReviewDecisionEligibility decision_eligibility = 9;
}
message PendingApplicationVersionReviewPage { repeated PendingApplicationVersionReview items = 1; string next_page_token = 2; google.protobuf.Timestamp as_of = 3; }
message ReviewApplicationContext { string application_id = 1; string name = 2; string admin_id = 3; string lifecycle_status = 4; string platform_availability_status = 5; }
message ReviewVersionContext { string version_id = 1; int32 sequence = 2; string review_status = 3; int64 revision = 4; string created_by = 5; }
message ReviewPolicyContext { string version = 1; repeated string required_check_ids = 2; }
message ApplicationVersionReviewDetail {
  ReviewApplicationContext application = 1;
  ReviewVersionContext version = 2;
  app_center.v1.application_review.ApplicationReviewResource review = 3;
  ReviewPolicyContext current_policy = 4;
  ReviewDecisionEligibility decision_eligibility = 5;
  google.protobuf.Timestamp as_of = 6;
}
