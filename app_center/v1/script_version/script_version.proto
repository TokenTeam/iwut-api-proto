syntax = "proto3";

package app_center.v1.script_version;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/TokenTeam/iwut-api-proto/gen/go/app_center/v1/script_version;scriptversion";

// The write commands require app.script.maintain in a trusted App USER identity.
service ScriptVersionService {
  rpc CreateScriptVersionDraft(CreateScriptVersionDraftRequest) returns (ScriptVersion) {
    option (google.api.http) = {
      post: "/v1/script-resources/{resource_id}/versions"
      body: "draft"
    };
  }

  rpc ReplaceScriptVersionDraft(ReplaceScriptVersionDraftRequest) returns (ScriptVersion) {
    option (google.api.http) = {
      put: "/v1/script-resources/{resource_id}/versions/{version_id}/draft"
      body: "command"
    };
  }

  rpc SubmitScriptVersionReview(SubmitScriptVersionReviewRequest) returns (ScriptVersionReviewSubmission) {
    option (google.api.http) = {
      post: "/v1/script-resources/{resource_id}/versions/{version_id}/reviews"
      body: "command"
    };
  }
}

message CreateScriptVersionDraftRequest {
  string resource_id = 1;
  CreateScriptVersionDraftInput draft = 2;
}

message CreateScriptVersionDraftInput {
  string version_label = 1;
  string content_format = 2;
  string content_text = 3;
}

message ReplaceScriptVersionDraftRequest {
  string resource_id = 1;
  string version_id = 2;
  ReplaceScriptVersionDraftInput command = 3;
}

message ReplaceScriptVersionDraftInput {
  int64 expected_revision = 1;
  string content_format = 2;
  string content_text = 3;
}

enum ScriptVersionState {
  SCRIPT_VERSION_STATE_UNSPECIFIED = 0;
  SCRIPT_VERSION_STATE_DRAFT = 1;
  SCRIPT_VERSION_STATE_SUBMITTED = 2;
  SCRIPT_VERSION_STATE_APPROVED = 3;
  SCRIPT_VERSION_STATE_REJECTED = 4;
}

message ScriptVersion {
  string resource_id = 1;
  string version_id = 2;
  string version_label = 3;
  string content_format = 4;
  string content_text = 5;
  string digest = 6;
  ScriptVersionState state = 7;
  int64 revision = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}


message SubmitScriptVersionReviewRequest {
  string resource_id = 1;
  string version_id = 2;
  SubmitScriptVersionReviewInput command = 3;
}

message SubmitScriptVersionReviewInput {
  int64 expected_revision = 1;
}

message ScriptVersionReviewSubmission {
  string review_id = 1;
  ScriptVersionState state = 2;
  int64 revision = 3;
  google.protobuf.Timestamp submitted_at = 4;
  string policy_version = 5;
}
