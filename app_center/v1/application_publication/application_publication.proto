syntax = "proto3";

package app_center.v1.application_publication;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/TokenTeam/iwut-api-proto/gen/go/app_center/v1/application_publication;applicationpublication";

service ApplicationPublication {
  rpc PlaceApprovedVersionInTestSlot(PlaceApprovedVersionInTestSlotRequest)
      returns (PlaceApprovedVersionInTestSlotResponse) {
    option (google.api.http) = {
      put: "/v1/applications/{application_id}/publications/{rpc_api_major}/test-slot"
      body: "command"
    };
  }
  rpc SetApprovedVersionInStableSlot(SetApprovedVersionInStableSlotRequest)
      returns (SetApprovedVersionInStableSlotResponse) {
    option (google.api.http) = {
      put: "/v1/applications/{application_id}/publications/{rpc_api_major}/stable-slot"
      body: "command"
    };
  }
  rpc ClearStableSlot(ClearStableSlotRequest) returns (ClearStableSlotResponse) {
    option (google.api.http) = {
      delete: "/v1/applications/{application_id}/publications/{rpc_api_major}/stable-slot"
    };
  }
  rpc SetGreyRollout(SetGreyRolloutRequest) returns (SetGreyRolloutResponse) {
    option (google.api.http) = {
      put: "/v1/applications/{application_id}/publications/{rpc_api_major}/grey-rollout"
      body: "command"
    };
  }
  rpc ClearGreyRollout(ClearGreyRolloutRequest) returns (ClearGreyRolloutResponse) {
    option (google.api.http) = {
      delete: "/v1/applications/{application_id}/publications/{rpc_api_major}/grey-rollout"
    };
  }
}

message PlaceApprovedVersionInTestSlotRequest {
  string application_id = 1;
  int32 rpc_api_major = 2;
  PlaceApprovedVersionInTestSlotCommand command = 3;
}

message PlaceApprovedVersionInTestSlotCommand {
  string version_id = 1;
  optional int64 expected_publication_revision = 2;
}

message PlaceApprovedVersionInTestSlotResponse {
  bool changed = 1;
  ApplicationPublicationResource publication = 2;
  ApplicationPublicationHistoryResource history = 3;
}

message SetApprovedVersionInStableSlotRequest {
  string application_id = 1;
  int32 rpc_api_major = 2;
  SetApprovedVersionInStableSlotCommand command = 3;
}

message SetApprovedVersionInStableSlotCommand {
  string version_id = 1;
  optional int64 expected_publication_revision = 2;
}

message SetApprovedVersionInStableSlotResponse {
  bool changed = 1;
  ApplicationPublicationResource publication = 2;
  ApplicationPublicationHistoryResource history = 3;
}

message ClearStableSlotRequest {
  string application_id = 1;
  int32 rpc_api_major = 2;
  int64 expected_publication_revision = 3;
}

message ClearStableSlotResponse {
  bool changed = 1;
  ApplicationPublicationResource publication = 2;
  ApplicationPublicationHistoryResource history = 3;
}

message SetGreyRolloutRequest {
  string application_id = 1;
  int32 rpc_api_major = 2;
  SetGreyRolloutCommand command = 3;
}

message SetGreyRolloutCommand {
  string version_id = 1;
  int32 exposure_basis_points = 2;
  int64 expected_publication_revision = 3;
}

message SetGreyRolloutResponse {
  bool changed = 1;
  ApplicationPublicationResource publication = 2;
  ApplicationPublicationHistoryResource history = 3;
}

message ClearGreyRolloutRequest {
  string application_id = 1;
  int32 rpc_api_major = 2;
  int64 expected_publication_revision = 3;
}

message ClearGreyRolloutResponse {
  bool changed = 1;
  ApplicationPublicationResource publication = 2;
  ApplicationPublicationHistoryResource history = 3;
}

message GreyRolloutResource {
  string rollout_id = 1;
  string version_id = 2;
  int32 exposure_basis_points = 3;
}

message ApplicationPublicationResource {
  string publication_id = 1;
  string application_id = 2;
  int32 rpc_api_major = 3;
  optional string test_version_id = 4;
  int64 revision = 5;
  string created_by = 6;
  google.protobuf.Timestamp created_at = 7;
  string updated_by = 8;
  google.protobuf.Timestamp updated_at = 9;
  optional string stable_version_id = 10;
  optional GreyRolloutResource grey_rollout = 11;
}

message ApplicationPublicationHistoryResource {
  string history_id = 1;
  string publication_id = 2;
  string application_id = 3;
  int32 rpc_api_major = 4;
  int64 publication_revision = 5;
  string action = 6;
  optional string previous_version_id = 7;
  optional string new_version_id = 8;
  optional string approved_review_id = 9;
  optional int64 scope_catalog_revision = 10;
  optional string preflight_policy_version = 11;
  string changed_by = 12;
  google.protobuf.Timestamp changed_at = 13;
  optional string grey_rollout_id = 14;
  optional int32 previous_exposure_basis_points = 15;
  optional int32 new_exposure_basis_points = 16;
}
