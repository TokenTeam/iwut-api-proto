syntax = "proto3";
package app_center.v1.application_profile_revision;
import "google/api/annotations.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
option go_package = "github.com/TokenTeam/iwut-api-proto/gen/go/app_center/v1/application_profile_revision;applicationprofilerevision";

service ApplicationProfileRevision {
  rpc CreateApplicationProfileRevision(CreateApplicationProfileRevisionRequest) returns (CreateApplicationProfileRevisionResponse) {
    option (google.api.http) = {
      post: "/v1/applications/{application_id}/profile-revisions"
      body: "profile"
    };
  }
  rpc UpdateApplicationProfileRevision(UpdateApplicationProfileRevisionRequest) returns (UpdateApplicationProfileRevisionResponse) {
    option (google.api.http) = {
      put: "/v1/applications/{application_id}/profile-revisions/{profile_revision_id}"
      body: "profile"
    };
  }
  rpc ListApplicationProfileRevisions(ListApplicationProfileRevisionsRequest) returns (OwnedApplicationProfileRevisionPage) {
    option (google.api.http) = { get: "/v1/applications/{application_id}/profile-revisions" };
  }
  rpc GetApplicationProfileRevision(GetApplicationProfileRevisionRequest) returns (OwnedApplicationProfileRevisionDetail) {
    option (google.api.http) = { get: "/v1/applications/{application_id}/profile-revisions/{profile_revision_id}" };
  }
}
message ApplicationProfileContent {
  string display_name = 1;
  // Required presence; only string_value and null_value are accepted.
  google.protobuf.Value description = 2;
  google.protobuf.Value icon = 3;
}
message CreateApplicationProfileRevisionRequest {
  // HTTP obtains application_id only from the path.
  string application_id = 1 [json_name = "application_id"];
  reserved 2, 3, 4;
  reserved "display_name", "description", "icon";
  // The HTTP body contains only these editable fields.
  ApplicationProfileContent profile = 5;
}
message CreateApplicationProfileRevisionResponse {
  string profile_revision_id = 1;
  string application_id = 2;
  int32 sequence = 3;
  string display_name = 4;
  google.protobuf.Value description = 5;
  google.protobuf.Value icon = 6;
  string review_status = 7;
  string created_by = 8;
  google.protobuf.Timestamp created_at = 9;
  int64 revision = 10;
  string updated_by = 11;
  google.protobuf.Timestamp updated_at = 12;
}

message UpdateApplicationProfileRevisionRequest {
  // HTTP obtains both IDs only from the path and expected_revision from If-Match.
  string application_id = 1 [json_name = "application_id"];
  string profile_revision_id = 2 [json_name = "profile_revision_id"];
  int64 expected_revision = 3;
  reserved 4, 5, 6;
  reserved "display_name", "description", "icon";
  // The HTTP body contains only these editable fields.
  ApplicationProfileContent profile = 7;
}
message UpdateApplicationProfileRevisionResponse {
  string profile_revision_id = 1;
  string application_id = 2;
  int32 sequence = 3;
  string display_name = 4;
  google.protobuf.Value description = 5;
  google.protobuf.Value icon = 6;
  string review_status = 7;
  string created_by = 8;
  google.protobuf.Timestamp created_at = 9;
  int64 revision = 10;
  string updated_by = 11;
  google.protobuf.Timestamp updated_at = 12;
}

message ListApplicationProfileRevisionsRequest {
  string application_id = 1 [json_name = "application_id"];
  optional string review_status = 2 [json_name = "reviewStatus"];
  int32 page_size = 3 [json_name = "pageSize"];
  string page_token = 4 [json_name = "pageToken"];
}
message GetApplicationProfileRevisionRequest {
  string application_id = 1 [json_name = "application_id"];
  string profile_revision_id = 2 [json_name = "profile_revision_id"];
  int32 review_page_size = 3 [json_name = "reviewPageSize"];
  string review_page_token = 4 [json_name = "reviewPageToken"];
}
message OwnedApplicationProfileState {
  google.protobuf.Value working_profile_revision_id = 1;
  google.protobuf.Value current_published_profile_revision_id = 2;
}
message OwnedApplicationProfileReviewDecision {
  string outcome = 1;
  google.protobuf.Value reason = 2;
  string policy_version = 3;
  google.protobuf.Timestamp decided_at = 4;
}
message OwnedApplicationProfileReview {
  string profile_review_id = 1;
  int32 attempt = 2;
  string status = 3;
  int64 source_revision = 4;
  google.protobuf.Timestamp submitted_at = 5;
  OwnedApplicationProfileReviewDecision decision = 6;
}
message OwnedApplicationProfileLatestReviewSummary {
  string profile_review_id = 1;
  int32 attempt = 2;
  string status = 3;
  google.protobuf.Timestamp submitted_at = 4;
  google.protobuf.Timestamp decided_at = 5;
  optional string outcome = 6;
}
message OwnedApplicationProfileRevisionSummary {
  string profile_revision_id = 1;
  int32 sequence = 2;
  string review_status = 3;
  int64 revision = 4;
  string display_name = 5;
  google.protobuf.Value description = 6;
  google.protobuf.Value icon = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  bool is_current_working_revision = 10;
  bool is_current_published = 11;
  OwnedApplicationProfileLatestReviewSummary latest_review = 12;
}
message OwnedApplicationProfileRevisionPage {
  repeated OwnedApplicationProfileRevisionSummary items = 1;
  google.protobuf.Value next_page_token = 2;
  google.protobuf.Timestamp as_of = 3;
  OwnedApplicationProfileState profile_state = 4;
}
message OwnedApplicationProfileRevisionDetail {
  string application_id = 1;
  string profile_revision_id = 2;
  int32 sequence = 3;
  string review_status = 4;
  int64 revision = 5;
  ApplicationProfileContent content = 6;
  string created_by = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  OwnedApplicationProfileState profile_state = 10;
  bool is_current_working_revision = 11;
  bool is_current_published = 12;
  OwnedApplicationProfileReview latest_review = 13;
  repeated OwnedApplicationProfileReview reviews = 14;
  google.protobuf.Value next_review_page_token = 15;
  google.protobuf.Timestamp as_of = 16;
}
